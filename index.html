<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallpaper Generator · abstract</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f0710'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23ff8a4c' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%23ffd166'/%3E%3C/svg%3E" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      crossorigin="anonymous" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel" aria-label="Control panel">
        <div class="panel-handle" id="panelHandle" aria-label="Collapse / expand panel" role="button" tabindex="0">
          <div class="panel-handle__bar"></div>
        </div>
        <header class="panel__head">
          <h1>Wallpaper Generator</h1>
          <button class="panel-close" id="panelClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
        </header>
        <div id="panelBody">
        <section class="panel__group" data-section="style">
          <h2>Style</h2>
          <input id="styleSearch" class="form-control form-control-sm search" type="search" placeholder="Search styles…" />
          <div id="styleList" class="style-list" role="tablist"></div>
        </section>

        <section class="panel__group" data-section="canvas">
          <h2>Canvas</h2>
          <label class="field">
            <span>Resolution</span>
            <select id="resolution" class="form-select form-select-sm">
              <option value="1920x1080">1920 × 1080 (FHD)</option>
              <option value="2560x1440">2560 × 1440 (QHD)</option>
              <option value="3840x2160">3840 × 2160 (4K)</option>
              <option value="1080x1920">1080 × 1920 (mobile)</option>
              <option value="1280x720">1280 × 720 (HD)</option>
            </select>
          </label>
          <label class="field">
            <span>Mode</span>
            <div class="seg" id="modeTabs" role="group">
              <button data-mode="static" type="button" class="active">Static</button>
              <button data-mode="animated" type="button">Animated</button>
            </div>
          </label>
          <label class="field" id="animSpeedField" hidden>
            <span>Animation speed</span>
            <input id="animSpeed" class="form-range" type="range" min="0" max="200" step="1" value="60" />
          </label>
        </section>

        <section class="panel__group" data-section="seed">
          <h2>Seed</h2>
          <div class="input-group input-group-sm mb-2">
            <input id="seedInput" class="form-control" type="text" inputmode="numeric" />
            <button class="btn btn-outline-secondary" id="seedRandom" title="Random seed"><i class="bi bi-dice-5"></i></button>
          </div>
          <button class="btn btn-primary w-100" id="regenerate">Generate</button>
        </section>

        <section class="panel__group" data-section="palette">
          <h2>Palette</h2>
          <div class="palette-list" id="paletteList"></div>
        </section>

        <section class="panel__group" data-section="params">
          <h2>Style parameters</h2>
          <div id="paramsHost"></div>
        </section>

        <section class="panel__group" data-section="export">
          <h2>Export</h2>
          <button class="btn btn-outline-secondary w-100 mb-2" id="exportPng">Save PNG <kbd>S</kbd></button>
          <button class="btn btn-outline-secondary w-100" id="exportWebm" hidden>Record WebM (5s)</button>
        </section>

        <div class="panel__foot">
          <div class="shortcuts">
            <span><kbd>Space</kbd> new seed</span>
            <span><kbd>←</kbd><kbd>→</kbd> style</span>
            <span><kbd>A</kbd> animate</span>
          </div>
        </div>

        </div>
      </aside>

      <main id="stage">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas"></canvas>
          <div id="hud" class="hud" aria-hidden="true">
            <span id="hudStyle">—</span><span class="hud__sep">·</span><span id="hudRes">—</span><span class="hud__sep">·</span><span id="hudSeed">—</span>
          </div>
          <div id="overlay" class="overlay" hidden>
            <div class="overlay__spinner" aria-hidden="true"></div>
            <div class="overlay__text" id="overlayText">Generating…</div>
            <div class="overlay__sub" id="overlaySub">setting up the scene</div>
          </div>
        </div>
        <div id="toast" class="toast" hidden></div>
      </main>
    </div>

    <!-- Deliberately outside #app: #app has `contain: layout`, which creates
         its own containing block for position:fixed descendants — on mobile
         that pushed the button off-screen when the browser's address bar
         collapsed/expanded. -->
    <button class="panel-burger" id="panelBurger" aria-label="Open styles and settings panel" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <script type="module" src="./js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>
  </body>
</html>
