<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallpaper Generator · abstract</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f0710'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23ff8a4c' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='12' fill='%23ffd166'/%3E%3C/svg%3E" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel" aria-label="Панель управления">
        <div class="panel-handle" id="panelHandle" aria-label="Свернуть / развернуть панель" role="button" tabindex="0">
          <div class="panel-handle__bar"></div>
          <span class="panel-handle__label">Стили и настройки <span class="panel-handle__chevron">▲</span></span>
        </div>
        <header class="panel__head">
          <h1>Wallpaper Generator</h1>
          <button class="panel-close" id="panelClose" aria-label="Закрыть">×</button>
        </header>
        <div id="panelBody">
        <section class="panel__group" data-section="style">
          <h2>Стиль <span class="muted" id="styleCount"></span></h2>
          <input id="styleSearch" class="form-control form-control-sm search" type="search" placeholder="Поиск стиля…" />
          <div id="styleList" class="style-list" role="tablist"></div>
        </section>

        <section class="panel__group" data-section="canvas">
          <h2>Холст</h2>
          <label class="field">
            <span>Разрешение</span>
            <select id="resolution" class="form-select form-select-sm">
              <option value="1920x1080">1920 × 1080 (FHD)</option>
              <option value="2560x1440">2560 × 1440 (QHD)</option>
              <option value="3840x2160">3840 × 2160 (4K)</option>
              <option value="1080x1920">1080 × 1920 (mobile)</option>
              <option value="1280x720">1280 × 720 (HD)</option>
            </select>
          </label>
          <label class="field">
            <span>Режим</span>
            <div class="btn-group btn-group-sm seg" id="modeTabs" role="group">
              <button data-mode="static" class="btn btn-outline-secondary active">Статика</button>
              <button data-mode="animated" class="btn btn-outline-secondary">Анимация</button>
            </div>
          </label>
          <label class="field" id="animSpeedField" hidden>
            <span>Скорость анимации</span>
            <input id="animSpeed" class="form-range" type="range" min="0" max="200" step="1" value="60" />
          </label>
        </section>

        <section class="panel__group" data-section="seed">
          <h2>Сид</h2>
          <div class="input-group input-group-sm mb-2">
            <input id="seedInput" class="form-control" type="text" inputmode="numeric" />
            <button class="btn btn-outline-secondary" id="seedRandom" title="Случайный сид">🎲</button>
          </div>
          <button class="btn btn-primary w-100" id="regenerate">Сгенерировать</button>
        </section>

        <section class="panel__group" data-section="palette">
          <h2>Палитра</h2>
          <div class="palette-list" id="paletteList"></div>
        </section>

        <section class="panel__group" data-section="params">
          <h2>Параметры стиля</h2>
          <div id="paramsHost"></div>
        </section>

        <section class="panel__group" data-section="export">
          <h2>Экспорт</h2>
          <button class="btn btn-outline-secondary w-100 mb-2" id="exportPng">Сохранить PNG <kbd>S</kbd></button>
          <button class="btn btn-outline-secondary w-100" id="exportWebm" hidden>Записать WebM (5с)</button>
        </section>

        <div class="panel__foot">
          <div class="shortcuts">
            <span><kbd>Space</kbd> новый сид</span>
            <span><kbd>←</kbd><kbd>→</kbd> стиль</span>
            <span><kbd>A</kbd> анимация</span>
          </div>
        </div>

        </div>
      </aside>

      <main id="stage">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="canvas"></canvas>
          <div id="hud" class="hud" aria-hidden="true">
            <span id="hudStyle">—</span><span class="hud__sep">·</span><span id="hudRes">—</span><span class="hud__sep">·</span><span id="hudSeed">—</span>
          </div>
          <div id="overlay" class="overlay" hidden>
            <div class="overlay__spinner" aria-hidden="true"></div>
            <div class="overlay__text" id="overlayText">Генерирую…</div>
            <div class="overlay__sub" id="overlaySub">подготовка сцены</div>
          </div>
        </div>
        <div id="toast" class="toast" hidden></div>
      </main>
    </div>

    <script type="module" src="./js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>
  </body>
</html>
